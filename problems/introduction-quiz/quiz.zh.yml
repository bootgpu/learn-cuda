questions:
  - id: speedup
    prompt: 一段图像处理程序，在 CPU 上跑 90 秒，改写成 GPU 版后跑 6 秒。加速比是多少？
    explanation: 加速比 = 原来的时间 ÷ 现在的时间 = 90 ÷ 6 = 15。

  - id: more-cores
    prompt: 一个按顺序写的单线程程序，原来在 4 核电脑上跑。换到一台 16 核电脑，每个核和原来一样快。这个程序大约会快多少？
    options:
      - 快 4 倍左右，因为核数是原来的 4 倍
      - 快 16 倍左右，因为每个核都能分到活
      - 基本不变，因为它只用得上一个核
      - 快 2 倍左右，因为多出的核能分担一部分
    feedback:
      0: 一个线程同一时刻只能在一个核上跑，多出的核都闲着。
      1: 只有一个核有活干；要先把程序拆成多个线程，别的核才分得到活。
      3: 程序里没有任何东西把活分给多出的核。
    explanation: 一个线程同一时刻只能在一个核上跑。按顺序写的程序只有一个线程，核再多也只用得上其中一个，而这个核并没有变快。想随着核数变快，得先把程序拆成能同时执行的多个线程。

  - id: throughput-task
    prompt: 下面哪个任务最看重吞吐，也就是同样的时间里做完的事越多越好，而不是单件事多快做完？
    options:
      - 玩家按下跳跃键后，角色多快起跳
      - 给 10 万张照片各做一张缩略图
      - 在搜索框里打字时，联想提示多快弹出
      - 点击网页上的按钮后，页面多快有反应
    feedback:
      0: 玩家等的是这一次起跳，看重的是要等多久，属于延迟。
      2: 用户等的是每一次提示，看重的是延迟。
      3: 用户等的是这一次反应，看重的是延迟。
    explanation: 没人在等某一张缩略图，要的是 10 万张尽快全部做完，这是吞吐导向。每张缩略图各做各的，能分给大量线程同时做，正适合 GPU。另外三个都是有人在等一个结果，看重的是延迟。

  - id: idle-cores
    prompt: 某 GPU 程序开的线程数，正好和 GPU 的核一样多。实测发现，核常常闲着没活干。最可能的原因是什么？
    options:
      - 每个核做得太小，一次运算要花很久才算完
      - 线程太多，核来回切换忙不过来
      - 主频太低，每条指令都执行得慢
      - 线程太少，等显存时没有别的线程可换
    feedback:
      0: 算得慢只会让核一直在忙，不会让它闲着。
      1: 线程数和核一样多，并不算多；而且切换线程，正是 GPU 填满等待时间的办法。
      2: 指令执行得慢只会让核一直在忙，不会让它闲着。
    explanation: 线程去显存取数据，常常要等很久。线程多的时候，核就切换到别的线程。线程数只有核那么多，一个线程在等，它的核没有别的线程可换，只能闲着。线程够多，等待才能被藏起来。

  - id: cpu-or-gpu
    prompt: 下面这些活，哪些适合交给 GPU？
    options:
      - 读配置文件，决定这次用哪种滤镜
      - 给一张 2000 万像素的照片，逐个像素调亮度
      - 把 100 万个温度从摄氏换算成华氏
      - 一步步迭代，每一步都要用到上一步的结果
    explanation: GPU 适合数据量大、能同时处理的活，比如 2000 万个像素、100 万个温度，每个都各算各的。读配置只做一次、量很小；一步步迭代每一步都要等上一步，只能按顺序做。这两件是串行的部分，留给 CPU。

  - id: amdahl-speedup
    prompt: 一个程序，运行时间的 80% 花在能并行的部分，20% 花在串行的部分。把能并行的部分搬到 GPU 上，这部分快了 4 倍，串行的部分不变。总的加速比是多少？
    explanation: 把原来的总时间记作 100%。串行的部分还是 20%，能并行的部分变成 80% ÷ 4 = 20%，现在一共 40%。总的加速比 = 100% ÷ 40% = 2.5。

  - id: serial-limit
    prompt: 要让总的加速比上限至少有 50 倍，串行的部分最多能占运行时间的百分之几？（填百分号前的数字，如 30% 填 30）
    explanation: 能并行的部分再怎么加速，时间最多缩到零，总时间至少还剩串行的那部分。串行占 2%，总时间至少是原来的 2%，上限是 100% ÷ 2% = 50 倍；超过 2%，上限就不到 50 倍。

  - id: memory-bound
    prompt: 某 GPU 程序每从显存读两个数，只做一次加法，已知它卡在搬数据上。换一块运算单元多一倍、显存带宽不变的 GPU，它最可能怎样？
    options:
      - 几乎不变，因为卡住它的是搬数据
      - 快 2 倍左右，因为能同时算的多了一倍
      - 变慢，因为运算单元多了，抢着读显存
    feedback:
      1: 运算单元本来就在等数据，多出来的也只是一起等。
      2: 运算单元多了，并不会让数据搬得更慢；带宽没变，速度也就基本不变。
    explanation: 这个程序是访存受限的。算得再快也得等数据，而显存带宽没变，所以速度基本不变。想让它变快，得加大带宽，或者少搬几趟。

  - id: fair-speedup
    prompt: 一篇文章说：「我们的 GPU 版比 CPU 版快 300 倍。」仔细一看，CPU 版只用了 1 个核，也没做优化。下面哪个说法最合理？
    options:
      - 300 倍全是 GPU 的功劳，换哪种 CPU 版都差不多
      - GPU 的峰值本来就是 CPU 的 300 倍，这个数很正常
      - CPU 版太慢也撑大了倍数，换成多核优化版，倍数会小很多
      - 只用 1 个核对比更公平，这个结论可以直接引用
    feedback:
      0: 加速比要除以 CPU 版的时间，CPU 版越慢，倍数越大。
      1: 最新 GPU 和最强服务器 CPU 的峰值差距在十倍左右，不是 300 倍。
      3: 最强的服务器 CPU 有上百个核，拿一个没优化的核来比，对 CPU 不公平。
    explanation: 加速比 = CPU 版的时间 ÷ GPU 版的时间，CPU 版越慢，倍数就越大。这 300 倍里，一部分来自 GPU，一部分来自 CPU 版只用了一个核、也没优化。换成优化过的多核 CPU 版，倍数会小很多。

  - id: uneven-data
    prompt: 要统计一篇文档每一行有多少个词，一个线程负责一行。有的行有几千个词，有的只有几个词。这会碰上并行程序的哪个难点？
    options:
      - 看输入数据：有的线程忙死，有的闲着
      - 并行算法的总工作量，比串行算法多得多
      - 卡在搬数据上，也就是访存受限
      - 线程之间要配合，得互相等
    feedback:
      1: 按行数词，总工作量和串行一样，只是分得不均。
      2: 问题不在数据搬得快不快，而在有的线程活多、有的活少。
      3: 每个线程只数自己那一行，不需要别的线程配合。
    explanation: 每个线程跑多久，取决于它那一行有多长。行短的线程早早做完、闲着，程序却要等行长的线程。数据分布不均匀时，并行程序跑得快不快，就很看输入的数据。
