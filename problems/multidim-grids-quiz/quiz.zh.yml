questions:
  - id: grid-of-image
    prompt: |-
      一张图片宽 100、高 70 像素，一个线程处理一个像素。启动代码是：

      ```cpp
      dim3 block(32, 8);
      dim3 grid((width + block.x - 1) / block.x, (height + block.y - 1) / block.y);
      ```

      kernel 里用 `if (col < width && row < height)` 挡住图片外的线程。按顺序填四个数，用逗号隔开：

      1. 每个 block 有多少个线程？
      2. grid 里一共有多少个 block？
      3. 一共启动了多少个线程？
      4. 有多少个线程通过了 `if`？
    explanation: 每个 block 有 32 × 8 = 256 个线程。x 方向 (100 + 31) / 32 = 4 个 block，y 方向 (70 + 7) / 8 = 9 个，一共 4 × 9 = 36 个 block，36 × 256 = 9216 个线程。图片只有 100 × 70 = 7000 个像素，通过 `if` 的正好 7000 个，另外 2216 个被挡住。

  - id: swapped-grid
    prompt: |-
      一张图片宽 100、高 70 像素，kernel 这样算行号、列号：

      ```cpp
      int col = blockIdx.x * blockDim.x + threadIdx.x;
      int row = blockIdx.y * blockDim.y + threadIdx.y;
      if (col < width && row < height) {
          // 处理第 row 行、第 col 列的像素
      }
      ```

      启动代码里，grid 的两个方向写反了：

      ```cpp
      dim3 block(16, 16);
      dim3 grid((height + block.x - 1) / block.x, (width + block.y - 1) / block.y);
      ```

      结果图片右边有一部分像素没被处理。没被处理的第一列，列号是多少（从 0 数）？
    explanation: x 方向管列号，本该按宽算，这里按高算出 (70 + 15) / 16 = 5 个 block，只有 5 × 16 = 80 个线程，`col` 最大到 79，第 80 到 99 列没有线程处理。y 方向按宽算出 (100 + 15) / 16 = 7 个 block、112 行线程，比 70 行多，多出来的被 `if` 挡住，所以行没有漏。

  - id: row-col-major
    prompt: |-
      一个 30 行、50 列的矩阵，看第 7 行、第 12 列的元素（行号、列号都从 0 数）。按顺序填两个数，用逗号隔开：

      1. 按行优先摊平，它的下标是多少？
      2. 按列优先摊平，它的下标是多少？
    explanation: 行优先：前面有 7 整行，每行 50 个，7 × 50 + 12 = 362。列优先：前面有 12 整列，每列 30 个（矩阵的高），12 × 30 + 7 = 367。

  - id: index-to-row-col
    prompt: |-
      一张宽 50 像素的图片按行优先摊平。下标 1234 的像素在哪里（行号、列号都从 0 数）？按顺序填两个数，用逗号隔开：

      1. 行号
      2. 列号
    explanation: 每行 50 个，1234 ÷ 50 = 24 余 34。前面放满了 24 整行，所以它在第 24 行；在这一行里再数过 34 个，列号是 34。验算：24 × 50 + 34 = 1234。

  - id: index-3d
    prompt: 一块三维数据宽 40、高 25、深 10，一层接一层地摊平，每一层内部按行优先。x 是列号、y 是行号、z 是层号，都从 0 数。x = 3、y = 4、z = 2 的元素，下标是多少？
    explanation: 每层有 25 × 40 = 1000 个元素。前面有 2 整层，占 2000 个；这一层里前面有 4 整行，每行 40 个，占 160 个；再数过 3 个。2000 + 160 + 3 = 2163。

  - id: block-size-limits
    prompt: 下面哪些 block 尺寸能成功启动 kernel？
    options:
      - '`dim3 block(16, 16, 4)`'
      - '`dim3 block(32, 32, 2)`'
      - '`dim3 block(2, 2, 128)`'
      - '`dim3 block(1024, 1, 1)`'
    explanation: 一个 block 的线程数是三个方向相乘，不能超过 1024；z 方向还单独不能超过 64。16 × 16 × 4 = 1024，正好到顶，可以；32 × 32 × 2 = 2048，超了；2 × 2 × 128 只有 512 个线程，但 z 是 128，超过 64；1024 × 1 × 1 = 1024，可以。

  - id: matmul-column-indexes
    prompt: |-
      M、N、P 都是 n × n 的矩阵，在内存里按行优先存放，P = M × N。现在换一种分法：一个线程算 P 的一整列。负责第 `col` 列的线程，用 `row` 依次走过这一列的每个元素，再用 `k` 累加：

      ```cpp
      sum += M[①] * N[②];
      ```

      ① 和 ② 处该填什么？
    options:
      - ① `k * n + row`，② `k * n + col`
      - ① `row * n + k`，② `col * n + k`
      - ① `row * n + k`，② `k * n + col`
      - ① `k * n + col`，② `row * n + k`
    feedback:
      0: M 里取的是第 row 行、第 k 列的数，下标是行号乘 n 再加列号，即 `row * n + k`；`k * n + row` 是第 k 行、第 row 列。
      1: N 的一列在内存里不是连着放的。第 k 行、第 col 列的下标是 `k * n + col`；`col * n + k` 是第 col 行、第 k 列。
      3: 这把 M 和 N 的下标对调了。M 取的是第 row 行的数，N 取的是第 col 列的数。
    explanation: P 的第 row 行、第 col 列，不管由哪个线程算，都是 M 的第 row 行和 N 的第 col 列逐个相乘再相加。M 里第 row 行、第 k 列的下标是 `row * n + k`，N 里第 k 行、第 col 列的下标是 `k * n + col`。换了分法，变的只是一个线程算哪些元素，下标公式不变。

  - id: row-or-column
    prompt: P = M × N，P 有 4 行、2000 列。一种分法是一个线程算 P 的一整行，另一种是一个线程算一整列。只看线程数，哪种更能把 GPU 用满？
    options:
      - 一个线程算一行：开 4 个线程，每个算 2000 个元素
      - 一个线程算一列：开 2000 个线程，每个算 4 个元素
      - 两种一样：总共都要算 8000 个元素
    feedback:
      0: GPU 能同时跑成千上万个线程，4 个线程只用上极小一部分，其余都闲着。
      2: 总的活一样多，但能同时干活的线程数差了 500 倍。活分给的线程越多，同时算的就越多。
    explanation: GPU 靠大量线程同时跑来提速。按行分只有 4 个线程，按列分有 2000 个，能铺开得多。反过来，如果 P 是 2000 行、4 列，就该按行分。哪种分法更好，还跟读内存的方式有关，讲优化时再回来。
