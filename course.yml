# 课程目录：篇 → 章的顺序。章内关卡与状态在 chapters/<slug>/chapter.yml。
# 篇与章对应 PMPP 第 5 版第 1、2 篇（第 2–15 章）；旧的 learn-cuda-basics 目录在 archive/。
slug: learn-cuda
title:
  en: CUDA Parallel Programming
  zh: CUDA 并行编程
summary:
  en: "Write CUDA kernels chapter by chapter alongside PMPP: from your first kernel to convolution, reduction, scan, sorting and optimized matrix multiplication."
  zh: 跟着 PMPP 一章一章写 CUDA kernel：从第一个 kernel 写到卷积、归约、扫描、排序和矩阵乘优化。
parts:
  - title:
      en: Fundamental Concepts
      zh: 基础概念
    chapters:
      - data-parallel
      - multidim-grids
      - compute-architecture
      - memory-locality
      - performance
  - title:
      en: Parallel Patterns
      zh: 并行模式
    chapters:
      - convolution
      - stencil
      - histogram
      - reduction
      - scan
      - filter
      - merge
      - sorting
      - matmul-advanced
