# 课程目录：篇 → 章的顺序。章内关卡与状态在 chapters/<slug>/chapter.yml。
# 旧的 learn-cuda-basics 目录在 archive/。
slug: learn-cuda
title:
  en: CUDA Parallel Programming
  zh: CUDA 并行编程
summary:
  en: "Write CUDA kernels chapter by chapter: from turning a loop into your first kernel to convolution, reduction, prefix sums, sorting and faster matrix multiplication."
  zh: 一章一章写 CUDA kernel：从把循环改成第一个 kernel，写到卷积、归约、前缀和、排序和更快的矩阵乘。
parts:
  - title:
      en: GPU Programming Foundations
      zh: GPU 编程基础
    chapters:
      - data-parallel
      - multidim-grids
      - compute-architecture
      - memory-locality
      - performance
  - title:
      en: Classic Parallel Algorithms
      zh: 经典并行算法
    chapters:
      - convolution
      - stencil
      - histogram
      - reduction
      - scan
      - filter
      - merge
      - sorting
      - matmul-advanced
