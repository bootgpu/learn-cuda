[project]
name = "learn-cuda"
version = "0"
requires-python = ">=3.12"
dependencies = []

# torch matches the grading image (cuda@1: torch 2.11.0+cu128); only the CPU build is needed here.
[dependency-groups]
dev = ["numpy", "pytest", "pyyaml", "ruff", "torch==2.11.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
