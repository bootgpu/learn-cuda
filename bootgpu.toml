# The course series: learn (correctness on small tests) or peak (correctness, then performance); must match course.yml's slug prefix.
kind = "learn"
# The sandbox runtime every problem is graded on; scripts/verify.py checks /v1/runtimes lists it.
runtime = "cuda@1"
# GPUs a submission may run on, for the course package (scripts/build.py); the first is the default. MVP: T4 only.
gpus = ["t4"]
